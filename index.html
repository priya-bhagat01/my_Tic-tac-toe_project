<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tic Tac Toe</title>
	<link rel="stylesheet" type="text/css" href="TicTacToeproject.css">
	<script src="TicTacToeproject.js" defer></script>
</head>
<body>
	<div class="main">
		<div class="game-title">
			<h1>Tic Tac Toe</h1>
		</div>

		<div class="winner hide">
			<p class="win">Winner is X</p>
			<button class="new">New Game</button>
		</div>

		<div class="container">
			<div class="boxes">
				<button class="position"></button>
				<button class="position"></button>
				<button class="position"></button>
				<button class="position"></button>
				<button class="position"></button>
				<button class="position"></button>
				<button class="position"></button>
				<button class="position"></button>
				<button class="position"></button>
			</div>
		</div>

		<div class="Reset">
			<button id="reset-btn">Reset Game</button>
		</div>
	</div>
</body>
</html>
